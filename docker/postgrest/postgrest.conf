# ──────────────────────────────────────────────────────────────────────────────
# PostgREST Configuration — NPUPS
# https://postgrest.org/en/stable/configuration.html
# These values are overridden by PGRST_* environment variables in docker-compose.
# ──────────────────────────────────────────────────────────────────────────────

# PostgreSQL connection string
db-uri = "postgres://authenticator:CHANGE_ME@db:5432/npups"

# Schema to expose as REST API
db-schemas = "public"

# Role used for unauthenticated requests (login endpoint only)
db-anon-role = "web_anon"

# JWT secret — must match app.jwt_secret set in PostgreSQL
jwt-secret = "CHANGE_ME_SAME_AS_NPUPS_JWT_SECRET"

# JWT expiry tolerance (seconds)
jwt-secret-is-base64 = false

# Listen on all interfaces inside the container
server-host = "0.0.0.0"
server-port = 3000

# Log level: crit | error | warn | info
log-level = "warn"

# Max rows returned per request (prevent accidental full-table scans)
db-max-rows = 1000

# Pre-request hook — not needed when using JWT (role is set from JWT claim)
# db-pre-request = "public.pre_request"
