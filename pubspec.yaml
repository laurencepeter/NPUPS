name: workforce
description: >
  WorkForce — Digital workflow for employee enrollment, payroll processing, and HR reporting.
  Developed by Laurence Peter. Built with AI support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  google_fonts: ^6.1.0
  excel: ^4.0.6
  file_saver: ^0.2.14
  file_picker: ^8.0.0
  path_provider: ^2.1.4
  crypto: ^3.0.3
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
