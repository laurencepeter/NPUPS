# Processed by the nginx image's envsubst entrypoint at container start.
# The Dockerfile installs this at /etc/nginx/templates/default.conf.template;
# the only token substituted is ${API_UPSTREAM} (see NGINX_ENVSUBST_FILTER in
# the Dockerfile). Every $uri / $host / $scheme below is an nginx runtime
# variable and is deliberately left untouched.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy. The Flutter app calls /api/* on its own origin
    # and nginx forwards those to the backend, so no backend URL is baked into
    # the web build and there is no cross-origin CORS preflight on every call.
    # API_UPSTREAM must be the backend root with NO trailing slash and NO
    # /api suffix (e.g. http://api:8080); the /api/ path is preserved upstream.
    #
    # proxy_pass goes through a variable on purpose. A literal hostname would
    # be resolved when nginx loads its config, so if the api container is not
    # yet resolvable nginx aborts with "host not found in upstream" and the
    # whole web container crash-loops. With a variable, nginx resolves the
    # name per request via the resolver below, so it starts (and serves the
    # static app) regardless of api availability; /api/* just returns 502
    # until api comes up. 127.0.0.11 is Docker's embedded DNS, used on every
    # compose/Coolify network.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flutter routing — all non-API paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html or the Flutter service worker.
    # These are the update-detection files: if they're cached immutably,
    # browsers will never pick up a new deployment no matter how many
    # times the server is redeployed.
    location ~* (index\.html|flutter_service_worker\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Long-lived cache for content-hashed assets (Flutter fingerprints these)
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # main.dart.js and other JS: versioned by the service worker, so safe to cache
    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compress text-like responses on the fly. application/wasm matters
    # most here: it shrinks the CanvasKit renderer, the biggest single
    # download in a Flutter web cold start. comp_level 6 also tightens
    # main.dart.js well beyond nginx's default level 1.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;
}
