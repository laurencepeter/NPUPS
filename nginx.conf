server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter routing — all paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html or the Flutter service worker.
    # These are the update-detection files: if they're cached immutably,
    # browsers will never pick up a new deployment no matter how many
    # times the server is redeployed.
    location ~* (index\.html|flutter_service_worker\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Long-lived cache for content-hashed assets (Flutter fingerprints these)
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # main.dart.js and other JS: versioned by the service worker, so safe to cache
    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
