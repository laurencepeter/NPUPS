# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION compose — for Coolify
# ─────────────────────────────────────────────────────────────────────────────
#
# This stack is web + api ONLY. The database is Supabase (hosted externally).
#
#   Browser ──▶ web (nginx + Flutter)  ──▶  api (Node)  ──▶  Supabase
#               public: your domain        internal only
#
# ── How `web` is built ────────────────────────────────────────────────────────
#   `web` builds on the Coolify host from the root Dockerfile (`build: .`), which
#   runs `flutter build web --release` (dart2js). dart2js is memory/CPU-heavy and
#   at the default optimization (O4) it OOM-killed this constrained host
#   mid-compile (deploy exit 255). O2 still got killed, so the Dockerfile now
#   builds at dart2js optimization O1 to cap peak RAM. If the host is STILL killed
#   mid-compile, the only remaining lever is host RAM/swap. The tiny `api` image
#   also builds on the host (~15 s).
#
#   (Pulling a CI-built image from GHCR was tried instead, but the package is
#   private and the host pulls anonymously, so `docker compose up` failed with
#   `error from registry: unauthorized`. Building on the host needs no registry.)
#
# ── Coolify setup ────────────────────────────────────────────────────────────
#   1. Create a resource of type "Docker Compose" (not "Dockerfile").
#   2. Set its "Docker Compose Location" to:  docker-compose.prod.yml
#   3. Add environment variables in the Coolify UI:
#        SUPABASE_URL      → https://supabase.fireydev.com
#        SUPABASE_ANON_KEY → eyJ...
#   4. Assign your public domain to the `web` service (port 80).
#      Do NOT give `api` a domain — it must stay internal.
#   5. Everything builds on the host at deploy time, so there is no external image
#      to publish first and no CI/deploy ordering race: leave Coolify's "deploy on
#      push" ENABLED — it is the deploy trigger.
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in Coolify environment variables}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in Coolify environment variables}
      PORT: "8080"
    expose:
      - "8080"
    # node:alpine ships busybox wget. /api/health is a pure LIVENESS probe: it
    # returns HTTP 200 the moment Express is up and does NOT touch Supabase, so
    # a Supabase outage can never make this container unhealthy (and trigger a
    # Coolify restart loop). Supabase reachability is reported separately by
    # /api/ready, which is for debugging and is deliberately not polled here.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    # Built on the Coolify host from the root Dockerfile. dart2js peak memory is
    # capped via --dart2js-optimization=O2 in that Dockerfile to avoid the
    # OOM-kill the default O4 caused on this host (deploy exit 255; see header).
    build: .
    restart: unless-stopped
    environment:
      API_UPSTREAM: "http://api:8080"
    depends_on:
      - api
    expose:
      - "80"
    # Without an explicit healthcheck, Coolify cannot tell a healthy nginx (which
    # prints nothing to stdout on a clean start) apart from a broken one, so it
    # restart-loops the container and the log pane looks empty. nginx:alpine ships
    # busybox wget; fetching index.html proves nginx is serving the Flutter build.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
