# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION compose — for Coolify
# ─────────────────────────────────────────────────────────────────────────────
#
# This stack is web + api ONLY. The database is Supabase (hosted externally).
#
#   Browser ──▶ web (nginx + Flutter)  ──▶  api (Node)  ──▶  Supabase
#               public: your domain        internal only
#
# ── Coolify setup ────────────────────────────────────────────────────────────
#   1. Create a resource of type "Docker Compose" (not "Dockerfile").
#   2. Set its "Docker Compose Location" to:  docker-compose.prod.yml
#   3. Add environment variables in the Coolify UI:
#        SUPABASE_URL      → https://supabase.fireydev.com
#        SUPABASE_ANON_KEY → eyJ...
#   4. Assign your public domain to the `web` service (port 80).
#      Do NOT give `api` a domain — it must stay internal.
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      # NOTE: no ${VAR:?...} guard on purpose. That guard aborts `docker compose
      # up` before any container is created, leaving nothing in `docker ps -a`
      # and no logs — which makes a missing env var almost impossible to
      # diagnose on Coolify. Instead we let the container start and have the app
      # (server/index.js) fail fast with a specific FATAL message you can read
      # via `docker logs`. Set these in the Coolify UI on the api service.
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      PORT: "8080"
    expose:
      - "8080"
    # node:alpine ships busybox wget. /api/health is a pure LIVENESS probe: it
    # returns HTTP 200 the moment Express is up and does NOT touch Supabase, so
    # a Supabase outage can never make this container unhealthy (and trigger a
    # Coolify restart loop). Supabase reachability is reported separately by
    # /api/ready, which is for debugging and is deliberately not polled here.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: .
    restart: unless-stopped
    environment:
      API_UPSTREAM: "http://api:8080"
    depends_on:
      - api
    expose:
      - "80"
    # Without an explicit healthcheck, Coolify cannot tell a healthy nginx (which
    # prints nothing to stdout on a clean start) apart from a broken one, so it
    # restart-loops the container and the log pane looks empty. nginx:alpine ships
    # busybox wget; fetching index.html proves nginx is serving the Flutter build.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
