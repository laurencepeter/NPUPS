# ══════════════════════════════════════════════════════════════════════════════
# NPUPS — Full Stack (local dev & Coolify reference)
#
# Services:
#   db         — PostgreSQL 16 with pgjwt extension
#   postgrest  — Auto-generated REST API from the database schema
#   web        — Flutter web app served by Nginx
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up
#
# Coolify deployment:
#   Deploy each service separately in Coolify using the individual Dockerfiles
#   and pass environment variables through Coolify's service config.
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL with pgjwt
  # ──────────────────────────────────────────────────────────────────────────
  db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB:           ${POSTGRES_DB:-npups}
      POSTGRES_USER:         ${POSTGRES_USER:-npups_admin}
      POSTGRES_PASSWORD:     ${POSTGRES_PASSWORD}
      NPUPS_JWT_SECRET:      ${NPUPS_JWT_SECRET}
      POSTGREST_DB_PASSWORD: ${POSTGREST_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-npups_admin} -d ${POSTGRES_DB:-npups}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Do NOT expose port 5432 externally — access only via PostgREST or VPN
    # ports:
    #   - "5432:5432"

  # ──────────────────────────────────────────────────────────────────────────
  # PostgREST — REST API layer
  # ──────────────────────────────────────────────────────────────────────────
  postgrest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI:          postgres://authenticator:${POSTGREST_DB_PASSWORD}@db:5432/${POSTGRES_DB:-npups}
      PGRST_DB_SCHEMAS:      public
      PGRST_DB_ANON_ROLE:    web_anon
      PGRST_JWT_SECRET:      ${NPUPS_JWT_SECRET}
      PGRST_SERVER_HOST:     "0.0.0.0"
      PGRST_SERVER_PORT:     "3000"
      PGRST_LOG_LEVEL:       warn
      PGRST_DB_MAX_ROWS:     "1000"
    ports:
      - "3000:3000"   # Expose only within VPN network; Coolify can proxy via reverse proxy

  # ──────────────────────────────────────────────────────────────────────────
  # Flutter Web App
  # ──────────────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # API base URL must be accessible from the user's browser (not container-to-container)
        API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - postgrest
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
    driver: local
