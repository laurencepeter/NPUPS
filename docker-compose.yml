# Bring up the WorkForce API + Flutter web build against an external database.
#
#   DATABASE_URL=postgres://... docker compose up --build
#
# Or put DATABASE_URL in a .env file in this directory.
# For Supabase, use the "Direct connection" URL from your project's
# Settings → Database → Connection string.
#
# Then point a browser at http://localhost:8081
#   (or open http://localhost:8080/api/health to verify the API)

services:
  api:
    build: ./server
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your Supabase (or other) Postgres connection string}
      PORT: "8080"
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    # No API_BASE_URL build arg: the web app talks to its own origin and nginx
    # forwards /api/* to the api service below. API_UPSTREAM tells nginx where.
    environment:
      API_UPSTREAM: "http://api:8080"
    depends_on:
      - api
    ports:
      - "8081:80"
