# Bring up the WorkForce API + Flutter web build against Supabase.
#
#   SUPABASE_URL=https://supabase.fireydev.com \
#   SUPABASE_ANON_KEY=eyJ... \
#   docker compose up --build
#
# Or put both vars in a .env file in this directory.

services:
  api:
    build: ./server
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL to your Supabase project URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY to your Supabase anon key}
      PORT: "8080"
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_UPSTREAM: "http://api:8080"
    depends_on:
      - api
    ports:
      - "8081:80"
