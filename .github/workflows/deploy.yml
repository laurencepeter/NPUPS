name: Validate web build

# The production `web` image is built ON the Coolify host at deploy time
# (docker-compose.prod.yml uses `build: .`), so nothing is published to a
# registry. This workflow does NOT deploy or push anything — it compiles the
# release web build on a roomy GitHub runner so dart2js *compile* errors surface
# on `main` instead of only when the constrained host runs the build.
#
# Note: a green run here does NOT prove the host has enough RAM (the runner has
# far more); host OOM mitigation lives in the Dockerfile (--dart2js-optimization).
on:
  push:
    branches: [master, main]

# Cancel an in-flight build when a newer commit lands on the same branch.
concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image (validation only — not published)
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=4
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Build attempt $ATTEMPT of $MAX_RETRIES..."

            if docker buildx build \
                --cache-from "type=gha" \
                --cache-to "type=gha,mode=max" \
                . 2>&1; then
              echo "Build successful on attempt $ATTEMPT"
              break
            fi

            if [ $ATTEMPT -lt $MAX_RETRIES ]; then
              echo "Build failed. Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            else
              echo "Build failed after $MAX_RETRIES attempts."
              exit 1
            fi
          done
